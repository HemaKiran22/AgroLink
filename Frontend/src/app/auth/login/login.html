<div class="auth-page">

  <div class="auth-card">

    <div class="brand">
      <div class="logo">🌱</div>
      <h1>AgroLink</h1>
      <p>Sign in to continue</p>
    </div>

    <form #loginForm="ngForm" (ngSubmit)="login(loginForm)" novalidate>

      <div class="form-group">
        <label for="email">Email</label>

        <input
          id="email"
          type="email"
          name="email"
          [(ngModel)]="loginData.email"
          #email="ngModel"
          required
          email
          autocomplete="email"
          placeholder="Enter email">

        @if (email.invalid && (email.touched || loginForm.submitted)) {
          <small class="error-text">Enter a valid email.</small>
        }
      </div>

      <div class="form-group">
        <label for="password">Password</label>

        <input
          id="password"
          type="password"
          name="password"
          [(ngModel)]="loginData.password"
          #password="ngModel"
          required
          autocomplete="current-password"
          placeholder="Enter password">

        @if (password.invalid && (password.touched || loginForm.submitted)) {
          <small class="error-text">Password is required.</small>
        }
      </div>

      <button type="submit" class="primary-button" [disabled]="loading()">
        @if (loading()) {
          Signing in...
        } @else {
          Sign In
        }
      </button>

    </form>

    <p class="switch-text">
      Don't have an account?
      <a routerLink="/register">Register</a>
    </p>

  </div>

</div>
